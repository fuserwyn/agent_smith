[project]
name = "agent-smith"
version = "0.1.0"
description = "Code agent framework: Thought -> Code -> Observation loop with a sandbox and MCP tools"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "mcp>=1.12,<2",
]

[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"
agent-ui = "agent_smith.ui_server:main"

[dependency-groups]
dev = ["pytest>=8.3,<8.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_smith", "src/agent_mbpp", "src/agent_swebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# MBPP reference solutions from the moulinette dataset (e.g. task 593: re.sub('\\.[0]*', ...)) use non-raw
# regex strings; Python warns when they are parsed. Dataset code, not ours.
filterwarnings = ["ignore:invalid escape sequence:DeprecationWarning"]
