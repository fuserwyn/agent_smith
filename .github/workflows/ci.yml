name: CI

on:
  push:
  pull_request:

# Actions are pinned by commit SHA (a tag can be moved, a SHA cannot).
permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync
      - name: Tests (offline; the moulinette dataset is not in git)
        run: uv run pytest -q
